version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: barbershop-app:latest
    container_name: barbershop_app_container
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../barber-shop-main:/var/www
    networks:
      - barbershop-net

  webserver:
    image: nginx:alpine
    container_name: barbershop_nginx_container
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../barber-shop-main:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - barbershop-net

  db:
    image: mysql:8.0
    container_name: barbershop_mysql_container
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: barbershop_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: secure_password_123
      MYSQL_ROOT_PASSWORD: root_password_123
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - barbershop-net

networks:
  barbershop-net:
    driver: bridge

volumes:
  dbdata: