# Ambiente de desenvolvimento do BarberFlow (projeto barberflow-dev).
#
# Na raiz do repositório:
#   docker compose run --rm assets    gera o CSS e o JS do Vite em public/build (primeira vez e quando o front mudar)
#   docker compose up -d --wait       sobe tudo e espera ficar saudável
# Tela: http://localhost:8080/login. Passo a passo e comandos em docs/nuvem/DOCKER.md.
#
# Parar: docker compose down (sem -v, que apaga o banco).

name: barberflow-dev

# Credenciais do MySQL de desenvolvimento, as mesmas do compose antigo
# (decisão do Leonam em 13/11: nenhuma senha muda). O serviço db cria o banco com elas
# e o app conecta com os mesmos valores: o &nome marca o valor e o *nome repete.
x-mysql-credentials: &mysql-credentials
  MYSQL_DATABASE: &db-database barbershop_db
  MYSQL_USER: &db-username admin
  MYSQL_PASSWORD: &db-password secure_password_123
  MYSQL_ROOT_PASSWORD: root_password_123

# Configuração comum do app (PHP-FPM) e do scheduler: mesma imagem, mesmo código.
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: barberflow-app:dev
  environment:
    # Variáveis do container valem mais que o .env. Não coloque CACHE_STORE nem SESSION_DRIVER
    # aqui: o phpunit.xml não força esses dois e os testes passariam a usar o Redis.
    APP_URL: http://localhost:8080
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: "3306"
    DB_DATABASE: *db-database
    DB_USERNAME: *db-username
    DB_PASSWORD: *db-password
    REDIS_HOST: redis
    LOG_CHANNEL: stderr
  volumes:
    # Código do host; o vendor fica num volume do Docker (bem mais rápido que a pasta do Windows)
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: mysql:8.4.13
    environment: *mysql-credentials
    ports:
      # Só este computador acessa o banco (DBeaver, MySQL Workbench etc.)
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  redis:
    image: redis:8.10.3-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  app:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Na primeira subida o entrypoint roda o composer install, que pode levar alguns minutos
      start_period: 600s
      start_interval: 5s
    networks:
      - frontend
      - backend

  # Agendador do Laravel (php artisan schedule:work), com a mesma imagem e o mesmo código do app
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    # init repassa o sinal de parada ao PHP, que sozinho como processo 1 ignoraria o SIGTERM
    init: true
    stop_signal: SIGTERM
    depends_on:
      # Espera o app terminar o composer install e as migrations
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "schedule:list"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
      start_interval: 5s
    networks:
      - backend

  web:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
        # Se o app for recriado, o Nginx reinicia junto e pega o endereço novo
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/nginx_status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend

  # Build dos assets do Vite sem precisar de Node no computador. Só roda quando chamado:
  #   docker compose run --rm assets
  # Com Node 24 no host, o mesmo resultado sai de: npm install && npm run build
  assets:
    image: node:24.22.3-alpine
    profiles: ["assets"]
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run build"]
    volumes:
      - .:/app
      # node_modules do Linux num volume, separado do node_modules do Windows
      - node_modules:/app/node_modules
    # Rede padrão do Docker (só precisa de internet para o npm): assim não sobra rede
    # do projeto depois de um "docker compose down" sem o profile
    network_mode: bridge
    security_opt:
      - no-new-privileges:true

networks:
  # web e app
  frontend:
  # app, scheduler, db e redis
  backend:

volumes:
  dbdata:
  redisdata:
  vendor:
  node_modules:
