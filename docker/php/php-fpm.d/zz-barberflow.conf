; Pool "www" do PHP-FPM: só os ajustes do BarberFlow.
; O docker.conf e o zz-docker.conf da imagem oficial continuam valendo
; (logs no stderr, clear_env = no para o Laravel ler as variáveis do container, listen 9000).

[www]
; Tamanho do pool. Cada processo do Laravel usa por volta de 30 a 50 MB,
; então 10 processos cabem com folga numa instância de 2 GB junto com o Nginx.
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; Recicla o processo depois de 500 requisições (segura vazamento de memória)
pm.max_requests = 500

; Healthcheck: o php-fpm-healthcheck pergunta /ping por FastCGI e espera "pong".
; O Nginx só repassa o index.php, então o /ping não fica exposto para fora.
ping.path = /ping
ping.response = pong
; O ping do healthcheck não entra no log de acesso
access.suppress_path[] = /ping
