; Ajustes do BarberFlow por cima do php.ini-production (todas as imagens: dev e produção).
; Vira /usr/local/etc/php/conf.d/zz-barberflow.ini no build.

; Não anunciar a versão do PHP: some o header X-Powered-By.
expose_php = Off

; OPcache ligado no PHP-FPM. No CLI (artisan, composer) ele fica desligado, que é o padrão.
opcache.enable = 1
