; Só no alvo dev: vira /usr/local/etc/php/conf.d/zzz-dev.ini e é carregado depois do zz-otimizado.ini.
; O código vem montado do host e muda o tempo todo, então o OPcache confere a data
; dos arquivos em toda requisição e a edição aparece no próximo F5.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
