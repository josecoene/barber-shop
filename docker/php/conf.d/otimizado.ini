; Ajustes da rodada "otimizado" do teste de carga da Sprint 4 (barber-shop-cloud).
; Agora fazem parte da imagem: vira /usr/local/etc/php/conf.d/zz-otimizado.ini no build.
; No alvo dev, o dev.ini (carregado depois) volta a conferir a data dos arquivos.

; Não conferir a data dos arquivos PHP a cada requisição: na produção o código não muda
; dentro do container (versão nova = imagem nova).
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.max_accelerated_files=20000

; Guardar em memória o caminho resolvido dos arquivos
realpath_cache_size=4096K
realpath_cache_ttl=600
