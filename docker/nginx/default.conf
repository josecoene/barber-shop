# Nginx do BarberFlow (serviço web). Serve os arquivos de public/ e manda o resto
# para o PHP-FPM do serviço app (porta 9000). Usado no dev (montado) e na imagem web.
#
# Os headers de segurança (X-Frame-Options, CSP, HSTS...) ficam na aplicação, não aqui.
# A exceção é o X-Content-Type-Options nos arquivos que o Nginx entrega sozinho (public/ e
# /build/): essas respostas nunca passam pelo Laravel.
# Não há real_ip: quem decide em qual proxy confiar (o ALB) é o Laravel, pelo TrustProxies.

# Caminho que vai para o log de acesso: sem a query string (a busca leva nome e e-mail de
# cliente, e os links enviados por e-mail levam e-mail e assinatura) e sem o token dos links
# de redefinição de senha e de confirmação de e-mail (caminhos padrão do Laravel). Esse log
# vai para o CloudWatch e para o Loki. O $uri não serve: depois do try_files ele vira /index.php.
map $request_uri $barberflow_log_uri {
    "~*^/reset-password/"          /reset-password/[oculto];
    "~*^/email/verify/"            /email/verify/[oculto];
    "~^(?<barberflow_path>[^?]*)"  $barberflow_path;
}

# Mesmo começo de linha do formato da Sprint 4: o painel do Grafana lê o $request_time
# nessa posição, e o trecho entre aspas continua com 3 partes (método, caminho e protocolo).
# O X-Forwarded-For (IP real atrás do ALB) e o tempo do PHP vêm no fim.
log_format barberflow '$remote_addr - $remote_user [$time_local] "$request_method $barberflow_log_uri $server_protocol" '
                      '$status $body_bytes_sent $request_time "$http_user_agent" '
                      '"$http_x_forwarded_for" $upstream_response_time';

# Log de erro das requisições só com as falhas graves (crit, alert e emerg). O formato dele não
# se configura: nas falhas comuns (PHP-FPM fora do ar ou lento, num 502 ou 504) o Nginx grava a
# requisição inteira, com a query string, o token dos links e o Referer, e esse log também vai
# para o CloudWatch e para o Loki. O 502 e o 504 continuam no log de acesso, com o status e o
# $upstream_response_time. As mensagens de subida e parada do Nginx seguem o error_log do
# nginx.conf da imagem.
error_log stderr crit;

# Não mostrar a versão do Nginx (header Server e páginas de erro)
server_tokens off;

# Compressão para texto, HTML, CSS, JS e JSON (o text/html já entra por padrão)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    access_log /var/log/nginx/access.log barberflow;

    # Tamanho máximo do corpo da requisição, igual ao post_max_size do php.ini-production (8M)
    client_max_body_size 8m;

    # Arquivo que existe em public/ sai direto do Nginx; o resto vai para o Laravel.
    # O nosniff daqui vale só para esses arquivos: o que cai no index.php sai com os
    # headers da aplicação (o add_header não acompanha o desvio para o index.php).
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets do Vite: o nome do arquivo tem hash do conteúdo, então o navegador
    # pode guardar por um ano sem perguntar de novo (cada versão nova tem outro nome).
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /robots.txt {
        access_log off;
        log_not_found off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /index.php;

    # Só o front controller do Laravel vai para o PHP-FPM
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Com o container app parado, o endereço dele some da rede, e abrir a conexão fica
        # esperando: com o padrão de 60 s, cada requisição ficava presa até o 504. Com 2 s, o
        # Nginx desiste logo (502 ou 504). Com o app no ar, a conexão abre na hora, mesmo com
        # todos os processos do PHP-FPM ocupados; a espera pela resposta é o fastcgi_read_timeout
        # (60 s), que não muda. Medição em load-tests/resiliencia/README.md.
        fastcgi_connect_timeout 2s;
    }

    # Qualquer outro .php não é executado nem baixado
    location ~ \.php$ {
        return 404;
    }

    # Arquivos ocultos (.env, .htaccess, .git) nunca são servidos
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Métricas do Nginx (stub_status), lidas pelo nginx-prometheus-exporter do monitoramento.
# A porta 8081 não é publicada: só os containers da rede do Docker alcançam.
# O healthcheck do serviço web também usa esta página.
server {
    listen 8081;
    access_log off;

    location = /nginx_status {
        stub_status;
    }
}
