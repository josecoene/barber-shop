# Dependabot: pull requests semanais com as versões novas das dependências (docs/nuvem/CI-CD.md).
# - As atualizações menores (minor e patch) de cada ecossistema vêm juntas num pull request só;
#   as maiores (major) vêm uma por pull request, para cada uma ser lida com calma.
# - Cada ecossistema tem um limite de pull requests abertos ao mesmo tempo.
# - Versão nova só é proposta 7 dias depois de publicada (cooldown): tempo para a comunidade
#   achar uma versão adulterada, como a do Trivy em março de 2026. Alertas de segurança não
#   esperam.
# - As imagens Docker do docker/php/Dockerfile ficam na linha que o projeto usa: PHP 8.4, Node
#   24 e Nginx 1.30 (estável). Trocar de linha é decisão do grupo, feita à mão.
# - O que o Dependabot não vê e se atualiza à mão: as imagens do bloco env do ci.yml, o MySQL do
#   job do CI e dos compose, o Composer do setup-php e o Terraform 1.13.3 (ci.yml e
#   docs/nuvem/TERRAFORM.md). Como: docs/nuvem/CI-CD.md, "Atualizar versões".

version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      composer-menores:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore[Deps]'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-menores:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore[Deps]'

  # Atualiza o SHA e o comentário da versão de cada action dos workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions-menores:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore[CI]'

  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      docker-menores:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # PHP 8.4 é a versão da produção e do CI: só as correções da 8.4 (8.4.x).
      - dependency-name: php
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Node 24 é a linha LTS do projeto.
      - dependency-name: node
        update-types:
          - version-update:semver-major
      # Nginx: as versões com o segundo número ímpar (1.31) são a linha de testes (mainline).
      - dependency-name: nginx
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    commit-message:
      prefix: 'chore[Docker]'

  # Provider AWS e o .terraform.lock.hcl da raiz e do bootstrap. Depois de um pull request
  # dele, confira os hashes das quatro plataformas (docs/nuvem/TERRAFORM.md, "Atualizar versões").
  - package-ecosystem: terraform
    directories:
      - /terraform
      - /terraform/bootstrap
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      terraform-menores:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore[Terraform]'
